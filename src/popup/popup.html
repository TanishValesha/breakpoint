<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Breakpoint</h1>

    <label class="row">
      <span>Enabled</span>
      <input type="checkbox" id="enabled-toggle" />
    </label>

    <label class="row">
      <span>Break target</span>
      <input type="number" id="break-target" min="1" max="99" />
      <span>%</span>
    </label>

    <div class="section">
      <div class="section-header">
        <span>Reading queue</span>
        <button id="add-current">+ Add this page</button>
      </div>
      <ul id="queue-list"></ul>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
