<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="brand">
      <svg class="brand-mark" width="18" height="18" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="16" height="16" rx="3.2" fill="#2563eb" />
        <path d="M4.5 3H11.5V13L8 10.75L4.5 13V3Z" fill="#fff" />
        <rect x="4.5" y="6.5" width="7" height="1.5" fill="#2563eb" />
      </svg>
      <h1>Breakpoint</h1>
    </div>

    <label class="row">
      <span>Enabled</span>
      <input type="checkbox" id="enabled-toggle" />
    </label>

    <div class="section">
      <div class="section-header">
        <span>Reading timer (all-time)</span>
        <input type="checkbox" id="timer-enabled-toggle" title="Show timer" />
      </div>
      <div class="timer-row">
        <span id="timer-readout">—</span>
        <div class="timer-actions">
          <button id="timer-pause-resume">Pause</button>
          <button id="timer-reset" title="Reset your lifetime total to 0">Reset</button>
        </div>
      </div>
      <label class="row timer-nudge-row">
        <span>Break reminder — every</span>
        <input type="checkbox" id="nudge-enabled-toggle" />
      </label>
      <div class="nudge-presets" role="group" aria-label="Break reminder interval">
        <button type="button" class="preset-btn" data-minutes="5">5m</button>
        <button type="button" class="preset-btn" data-minutes="10">10m</button>
        <button type="button" class="preset-btn" data-minutes="15">15m</button>
        <button type="button" class="preset-btn" data-minutes="20">20m</button>
        <button type="button" class="preset-btn" data-minutes="25">25m</button>
        <button type="button" class="preset-btn" data-minutes="30">30m</button>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <span>Reading queue</span>
        <button id="add-current">+ Add this page</button>
      </div>
      <ul id="queue-list"></ul>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
