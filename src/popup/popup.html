<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="brand">
      <svg class="brand-mark" width="18" height="18" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="16" height="16" rx="4" fill="#2563eb" />
        <rect x="3" y="7" width="10" height="2" rx="1" fill="rgba(255,255,255,0.35)" />
        <rect x="3" y="7" width="6" height="2" rx="1" fill="#fff" />
      </svg>
      <h1>Breakpoint</h1>
    </div>

    <label class="row">
      <span>Enabled</span>
      <input type="checkbox" id="enabled-toggle" />
    </label>

    <div class="section">
      <div class="section-header">
        <span>Reading queue</span>
        <button id="add-current">+ Add this page</button>
      </div>
      <ul id="queue-list"></ul>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
